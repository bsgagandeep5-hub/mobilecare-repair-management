<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Edit Repair</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f6f9;
    overflow: hidden;
}

.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: #ffffff;
    width: 380px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
}

h1 {
    text-align: center;
    margin-bottom: 15px;
    color: #2c3e50;
    font-size: 22px;
}

form input, form select {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 13px;
}

form input:focus, form select:focus {
    outline: none;
    border-color: #007bff;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    border: none;
    color: white;
    font-size: 14px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}

.back-btn {
    margin-top: 10px;
    background-color: #6c757d;
}

.back-btn:hover {
    background-color: #5a6268;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Edit Repair</h1>

<form action="/edit-repair" method="post">

<input type="hidden" name="rid" th:value="${repair.rid}">

<input type="text" name="custName"
       th:value="${repair.customer.name}"
       placeholder="Customer Name" required>

<input type="number" name="custPhone"
       th:value="${repair.customer.phone}"
       placeholder="Customer Mobile" required>

<input type="text" name="issue"
       th:value="${repair.issue}"
       placeholder="Issue Description" required>

<input type="text" name="brand"
       th:value="${repair.brand}"
       placeholder="Brand Name" required>

<input type="text" name="model"
       th:value="${repair.model}"
       placeholder="Model Name" required>

<input type="number" name="cost"
       th:value="${repair.cost}"
       placeholder="Repair Cost" required>

<select name="status">
    <option value="Pending"
        th:selected="${repair.status == 'Pending'}">Pending</option>
    <option value="Completed"
        th:selected="${repair.status == 'Completed'}">Completed</option>
</select>

<button type="submit">Update Repair</button>

</form>

<a href="/manage-repairs">
<button class="back-btn">Back</button>
</a>

</div>
</div>

</body>
</html>
