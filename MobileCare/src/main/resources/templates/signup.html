<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Sign Up | MobileCare</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: #f5f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.auth-card {
    background: #ffffff;
    width: 400px;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    position: relative;
}

/* BACK BUTTON */
.back-btn {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 20px;
    text-decoration: none;
    color: #2563eb;
}

/* HEADING */
.auth-card h2 {
    text-align: center;
    margin-bottom: 16px;
    color: #0f172a;
    font-weight: 600;
}

/* INPUTS */
.auth-card input {
    width: 100%;
    padding: 11px;
    margin-bottom: 6px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    font-size: 13px;
}

.auth-card input:focus {
    outline: none;
    border-color: #2563eb;
}

/* ERROR MESSAGES */
.error {
    color: #dc2626;
    font-size: 12px;
    margin-bottom: 6px;
    display: block;
}

/* ROLE */
.role-box {
    margin: 6px 0 10px;
}

.role-box label {
    font-size: 13px;
    font-weight: 500;
    color: #334155;
}

.role-options {
    display: flex;
    justify-content: space-around;
    margin-top: 4px;
    font-size: 13px;
}

/* BUTTON */
.auth-card button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
}

/* TEXT */
.auth-card p {
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
}

.auth-card a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
}
</style>
</head>

<body>

<div class="auth-card">
    <!-- Back to Home -->
    <a href="/" class="back-btn">←</a>

    <h2>Create Account</h2>

    <form action="/signup" method="post" th:object="${userDto}">

        <input type="text"
               th:field="*{name}"
               placeholder="Full Name">
        <span class="error" th:errors="*{name}"></span>

        <!-- FIXED: tel instead of number -->
        <input type="tel"
               th:field="*{phone}"
               placeholder="Mobile Number">
        <span class="error" th:errors="*{phone}"></span>

        <input type="email"
               th:field="*{email}"
               placeholder="Email">
        <span class="error" th:errors="*{email}"></span>

        <input type="password"
               th:field="*{password}"
               placeholder="Password">
        <span class="error" th:errors="*{password}"></span>

        <input type="password"
               th:field="*{confirmPassword}"
               placeholder="Confirm Password">
        <span class="error" th:errors="*{confirmPassword}"></span>

        <div class="role-box">
            <label>Select Role</label>
            <div class="role-options">
                <label>
                    <input type="radio"
                           th:field="*{role}"
                           value="CUSTOMER" checked>
                    Customer
                </label>
                <label>
                    <input type="radio"
                           th:field="*{role}"
                           value="ADMIN">
                    Shop Keeper
                </label>
            </div>
            <span class="error" th:errors="*{role}"></span>
        </div>

        <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? <a href="/login">Login</a></p>
</div>

</body>
</html>
