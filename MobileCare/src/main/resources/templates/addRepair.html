<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Add Repair | MobileCare</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f6f9;
        overflow: hidden; /* 🔥 disables scrolling */
    }

    .container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: #ffffff;
        width: 380px;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 15px;
        color: #2c3e50;
        font-size: 22px;
    }

    form input {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-size: 13px;
    }

    form input:focus {
        outline: none;
        border-color: #007bff;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        border: none;
        color: white;
        font-size: 14px;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }

    .back-btn {
        margin-top: 10px;
        background-color: #6c757d;
    }

    .back-btn:hover {
        background-color: #5a6268;
    }
    .error {
    color: #dc2626;
    font-size: 12px;
    margin-bottom: 6px;
    display: block;
}
</style>


</head>

<body>

<div class="container">
    <div class="card">
        <h1>Add Repair</h1>

        <form method="post" action="/add-repair" th:object="${addRepairDto}">
            <input type="text" th:field="*{custName}" placeholder="Customer Name" required>
            <span class="error" th:errors="*{custName}"></span>
            
            <input type="number" th:field="*{custPhone}" placeholder="Customer Mobile" required>
            <span class="error" th:errors="*{custPhone}"></span>
            
            <input type="text" th:field="*{issue}" placeholder="Issue Description" required>
            <span class="error" th:errors="*{issue}"></span>
            
            <input type="text" th:field="*{brand}" placeholder="Brand Name" required>
            <span class="error" th:errors="*{brand}"></span>

            <input type="text" th:field="*{model}" placeholder="Model Name" required>
            <span class="error" th:errors="*{model}"></span>
            
            <input type="text" th:field="*{cost}" placeholder="Repair Cost" required>
            <span class="error" th:errors="*{cost}"></span>
            
            <input type="hidden" th:field="*{status}" >
            <span class="error" th:errors="*{status}"></span>
           

            <button type="submit">Add</button>
        </form>

        <a href="/dashboard">
            <button class="back-btn">Back to Dashboard</button>
        </a>
    </div>
</div>

</body>
</html>
