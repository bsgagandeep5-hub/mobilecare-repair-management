<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | MobileCare</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: #f5f7fb;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.auth-card {
    background: #ffffff;
    width: 380px;
    padding: 36px;
    border-radius: 18px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.12);
    position: relative;
}

/* BACK BUTTON */
.back-btn {
    position: absolute;
    top: 18px;
    left: 18px;
    font-size: 20px;
    text-decoration: none;
    color: #2563eb;
}

/* HEADING */
.auth-card h2 {
    text-align: center;
    margin-bottom: 12px;
    color: #0f172a;
    font-weight: 600;
}

/* ERROR MESSAGE */
.error-msg {
    color: red;
    text-align: center;
    margin-bottom: 14px;
    font-size: 14px;
}

/* INPUTS */
.auth-card input {
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
}

.auth-card input:focus {
    outline: none;
    border-color: #2563eb;
}

/* BUTTON */
.auth-card button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
}

/* TEXT */
.auth-card p {
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
}

.auth-card a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
}
</style>
</head>

<body>

<div class="auth-card">
    <a href="/" class="back-btn">←</a>

    <h2>Welcome Back</h2>

    <!-- ERROR MESSAGE FROM BACKEND -->
    <p class="error-msg" th:text="${message}">
       
    </p>

    <form action="/login" method="post">
        <input type="text" name="username"
               placeholder="Email or Mobile"
               required>

        <input type="password" name="password"
               placeholder="Password"
               required>

        <button type="submit">Login</button>
    </form>

    <p>Don’t have an account? <a href="/signup">Sign Up</a></p>
</div>

</body>
</html>
